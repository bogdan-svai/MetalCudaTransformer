name: Compiler verification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native_validation:
        description: Attempt native Metal builds and GPU verification
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compiler:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check formatting and imports
        run: make lint
      - name: Check shell scripts
        run: bash -n install.sh scripts/bootstrap.sh scripts/install_mcu.sh scripts/uninstall_mcu.sh
      - name: Test compiler and installation tooling
        run: |
          python -m pytest -q tests/test_cli.py tests/test_build.py \
            tests/test_compiler_correctness.py tests/test_device_rewriting.py \
            tests/test_clang_source_ranges.py tests/test_semantic_call_edits.py \
            tests/test_bootstrap.py

  native:
    if: github.event_name == 'workflow_dispatch' && inputs.native_validation
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ensure Metal compiler is available
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi
      - name: Verify native builds and GPU results
        run: make verify

name: MCU Verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Stage 1-10 verification
        run: make verify
      - name: Run optimizer quality gate
        run: |
          MCU_SEMANTIC_STRICT=1 python scripts/benchmark_optimization_suite.py \
            --only hotspot --samples 2 --warmups 1 --max-regression 0.20 \
            --output optimizer-quality-gate.json
      - name: Upload optimizer benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-quality-gate
          path: optimizer-quality-gate.json
      - name: Render optimizer benchmark summary
        if: always()
        run: python scripts/render_benchmark_report.py optimizer-quality-gate.json --output optimizer-quality-gate.md
      - name: Upload optimizer benchmark summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-quality-gate-summary
          path: optimizer-quality-gate.md

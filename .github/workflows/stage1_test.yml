name: Stage 1 Tests

on:
  push:
  pull_request:

jobs:
  stage1:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run Stage 1 tests
        run: pytest -q
